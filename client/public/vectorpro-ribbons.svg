<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <!-- Light blue/cyan background -->
  <rect width="1920" height="1080" fill="#C0E8F5"/>
  
  <!-- Deep blue ribbon (bottom layer) -->
  <path d="M -200,300 
           Q 200,250 500,350 
           T 1100,450 
           Q 1400,500 1700,400 
           L 2100,350
           L 2100,650
           Q 1700,700 1400,600
           T 800,700
           Q 500,750 200,650
           L -200,700 Z" 
        fill="#1E5AA8" 
        opacity="1"/>
  
  <!-- Medium blue/turquoise ribbon (middle layer) -->
  <path d="M -100,50
           Q 300,100 600,50
           T 1200,150
           Q 1500,200 1800,100
           L 2100,50
           L 2100,400
           Q 1800,450 1500,350
           T 900,450
           Q 600,500 300,400
           L -100,450 Z"
        fill="#3BA0C8"
        opacity="1"/>
  
  <!-- Light cyan ribbon (top layer) -->
  <path d="M -200,-100
           Q 100,0 400,-50
           T 900,100
           Q 1200,150 1500,50
           L 2100,0
           L 2100,350
           Q 1800,400 1500,300
           T 900,400
           Q 600,450 300,350
           L -200,400 Z"
        fill="#00D9E6"
        opacity="1"/>
</svg>
